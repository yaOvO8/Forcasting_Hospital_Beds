[project]
name = "hospital-beds"
version = "0.1.0"
description = "06-763 final project: forecasting next week's hospital bed occupancy from HHS data"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
beds = "beds.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Heavy dependencies for the modeling half. Installed by default (see
# default-groups below); skip with `uv sync --no-group model` on a slow machine.
model = ["torch>=2.3", "mlflow>=2.14"]

[tool.uv]
default-groups = ["dev", "model"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
