# Runs on every push and pull request: builds the uv environment and runs the
# end-to-end tests on synthetic data (no download, ~1 minute).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # lets the job commit a new or updated uv.lock on main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lock (creates uv.lock if it does not exist yet)
        run: uv lock
      - name: Install (data + dev groups; the model group is checked by `uv lock`)
        run: uv sync --no-group model
      - name: Test
        run: uv run pytest -q
      - name: Commit uv.lock if new or changed (main only, after tests pass)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add uv.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update uv.lock (generated by CI)"
            git push
          fi
      - name: Upload uv.lock
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
